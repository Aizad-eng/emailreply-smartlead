services:
  - type: web
    name: email-reply-bot-smartlead
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMARTLEAD_API_KEY
        sync: false
      - key: SMARTLEAD_WEBHOOK_SECRET
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: CALENDLY_API_KEY
        sync: false
